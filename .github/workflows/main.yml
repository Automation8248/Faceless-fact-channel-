name: Fact Video Automation

on:
  schedule:
    - cron: '0 4 * * *' # Daily subah 4:00 AM UTC par chalega
  workflow_dispatch: # Manual run ke liye

jobs:
  generate-and-post-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Fix for ImageMagick text rendering policy on Ubuntu
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>/<!-- <policy domain="path" rights="none" pattern="@\*"\/> -->/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gTTS moviepy==1.0.3 Pillow==9.5.0

      - name: Download Custom Font
        run: |
          # Updated working link for Roboto-Bold
          wget https://github.com/google/fonts/raw/main/ofl/roboto/Roboto-Bold.ttf -O Roboto-Bold.ttf
          
      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py
