name: Fact Video Automation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# YAHAN PERMISSIONS ADD KI GAYI HAIN PUSH KARNE KE LIYE
permissions:
  contents: write

jobs:
  generate-and-post-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gTTS moviepy==1.0.3 Pillow==9.5.0 numpy

      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py

      - name: Commit and Push Database (Cooling Period & Images)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add used_facts.json downloaded_images/ || echo "No new files to add"
          git commit -m "chore: Update fact cooling DB and categorize images" || echo "No changes to commit"
          git push
